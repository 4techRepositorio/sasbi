[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourpro-connectors"
version = "0.1.0"
description = "4Pro_BI — SPI e plugins de fontes de dados (TICKET-015)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fourpro-contracts",
    "httpx>=0.27",
]

[project.optional-dependencies]
sql = [
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "pyodbc>=5.0",
]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["fourpro_connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
