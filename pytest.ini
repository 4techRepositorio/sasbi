[pytest]
# Config na raiz para `pytest apps/api/tests` (paridade CI / make qa).
testpaths = apps/api/tests
pythonpath = apps/api
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib.handlers.argon2
markers =
    unit: testes unitários sem HTTP/DB completo
    integration: TestClient + DB
    api: contratos HTTP
    auth: login, refresh, MFA, reset
    tenant_isolation: isolamento cross-tenant
    rbac: papéis admin/analyst/consumer
    billing: planos, quotas, 402
    ingestion: upload, parse, catálogo
    security: tokens, spoofing, rate limit, sessão
    audit: audit log
    performance: smoke de latência
    concurrency: corridas / paralelismo
    slow: demorado ou ficheiros grandes
    postgres: requer Postgres (não SQLite)
